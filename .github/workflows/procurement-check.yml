name: Procurement holiday check (Quinta da Barroca)

# Daily at 06:00 UTC (07:00 Lisbon winter / 07:00 Lisbon summer-ish).
# Operating period: April–October only (script filters internally).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Run procurement check
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node procurement-check.mjs
