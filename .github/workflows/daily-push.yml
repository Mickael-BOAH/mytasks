name: Daily focus push

# 07:00 UTC every day — adjust to your timezone (Lisbon: 07 winter / 08 summer)
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Send daily push
        working-directory: scripts
        env:
          FIREBASE_SA:   ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC:  ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_EMAIL:   ${{ secrets.VAPID_EMAIL }}
        run: node daily-push.mjs
