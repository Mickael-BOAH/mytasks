<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BOA Hotels monogram — arch curve between B and H, in a portrait bordered rectangle -->
  <rect width="512" height="512" fill="#233b34"/>
  <rect x="106" y="20" width="300" height="472" fill="none" stroke="#e2dfd6" stroke-width="9"/>
  <text x="256" y="220" font-family="Georgia,'Cormorant Garamond',serif" font-size="205" font-weight="500" fill="#e2dfd6" text-anchor="middle" dominant-baseline="alphabetic">B</text>
  <path d="M 150 300 Q 256 250 362 300" fill="none" stroke="#e2dfd6" stroke-width="9" stroke-linecap="round"/>
  <text x="256" y="450" font-family="Georgia,'Cormorant Garamond',serif" font-size="205" font-weight="500" fill="#e2dfd6" text-anchor="middle" dominant-baseline="alphabetic">H</text>
</svg>
